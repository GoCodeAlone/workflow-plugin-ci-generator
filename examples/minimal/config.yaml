# workflow-plugin-ci-generator minimal example
# Generates CI/CD config files from a workflow project manifest.
# Validate with: wfctl validate --skip-unknown-types examples/minimal/config.yaml
#
# step.ci_generate config keys: platform (required), output_dir (required), project_name
# Valid platform values: github_actions, gitlab_ci, jenkins, circleci

workflows:
  pipeline:
    trigger:
      type: http
      config:
        path: /ci/generate
        method: POST
    steps:
      - name: generate-ci
        type: step.ci_generate
        config:
          platform: github_actions
          output_dir: .
          project_name: my-workflow-project
