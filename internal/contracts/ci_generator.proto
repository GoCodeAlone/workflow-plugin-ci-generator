syntax = "proto3";

package workflow.plugins.ci_generator.v1;

option go_package = "github.com/GoCodeAlone/workflow-plugin-ci-generator/internal/contracts;contracts";

message CIGenerateConfig {
  string platform = 1;
  string output_dir = 2;
  string infra_config = 3;
  string project_name = 4;
  string runner = 5;
  string default_branch = 6;
  // from_plan is an optional path to a CIPlan JSON file. When set, analysis is
  // skipped and the plan is rendered directly from the file.
  string from_plan = 7;
  // phase_config is an optional path to a prerequisite workflow config that
  // becomes the first DeployPhase (prereq) before the primary phase.
  string phase_config = 8;
}

message CIGenerateInput {
  string platform = 1;
  string output_dir = 2;
  string infra_config = 3;
  string project_name = 4;
  string runner = 5;
  string default_branch = 6;
  // from_plan is an optional path to a CIPlan JSON file. When set, analysis is
  // skipped and the plan is rendered directly from the file.
  string from_plan = 7;
  // phase_config is an optional path to a prerequisite workflow config that
  // becomes the first DeployPhase (prereq) before the primary phase.
  string phase_config = 8;
}

message CIGenerateOutput {
  string platform = 1;
  string output_dir = 2;
  repeated string files_written = 3;
  int32 file_count = 4;
  string error = 5;
}
